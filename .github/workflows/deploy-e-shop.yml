name: Deploy E-Shop Frontend

on:
  push:
    branches:
      - week11
    paths:
      - 'week-11/e-shop-frontend/**'
  pull_request:
    branches:
      - week11
    paths:
      - 'week-11/e-shop-frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week-11/e-shop-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: e-shop-frontend
          directory: dist
